<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts — Postella</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📮 Postella</div>
        <button class="nav-toggle" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="nav-menu">
            <a href="/index.html" class="nav-link">Dashboard</a>
            <a href="/calendar.html" class="nav-link">Calendar</a>
            <a href="/posts.html" class="nav-link active">Posts</a>
            <a href="/settings.html" class="nav-link">Settings</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            <a href="#" class="nav-link" id="logoutBtn">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="page-header">
            <h1>All Posts</h1>
            <button class="btn btn-primary" onclick="location.href='/create-post.html'">
                + Create Post
            </button>
        </div>
        
        <!-- Filters -->
        <div class="section">
            <div class="form-row">
                <div class="form-group">
                    <label for="filterStatus">Status</label>
                    <select id="filterStatus">
                        <option value="">All Statuses</option>
                        <option value="draft">Draft</option>
                        <option value="scheduled">Scheduled</option>
                        <option value="posted">Posted</option>
                        <option value="failed">Failed</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="filterPlatform">Platform</label>
                    <select id="filterPlatform">
                        <option value="">All Platforms</option>
                        <option value="facebook">Facebook</option>
                        <option value="instagram">Instagram</option>
                        <option value="linkedin">LinkedIn</option>
                        <option value="twitter">Twitter/X</option>
                    </select>
                </div>
            </div>
        </div>
        
        <!-- Posts List -->
        <div class="section">
            <div id="postsList" class="posts-list">
                <div class="loading">Loading posts...</div>
            </div>
            
            <!-- Pagination -->
            <div id="pagination" style="text-align: center; margin-top: 2rem;"></div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script>
        if (!requireAuth()) throw new Error('Auth required');
        
        let currentPage = 1;
        let filters = { status: '', platform: '' };
        
        async function loadPosts() {
            try {
                const params = new URLSearchParams({
                    page: currentPage,
                    per_page: 20,
                    ...filters
                });
                
                const data = await apiCall(`/posts?${params}`);
                displayPosts(data.posts);
                displayPagination(data);
            } catch (error) {
                console.error('Error loading posts:', error);
            }
        }
        
        function displayPosts(posts) {
            const container = document.getElementById('postsList');
            
            if (posts.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <h3>No posts found</h3>
                        <p>Create your first post or adjust your filters.</p>
                        <a href="/create-post.html" class="btn btn-primary">+ Create Post</a>
                    </div>`;
                return;
            }
            
            container.innerHTML = posts.map(post => `
                <div class="post-item">
                    <div class="post-info">
                        <div class="post-title">${post.title}</div>
                        <div class="post-meta">
                            ${getPlatformBadge(post.platform)}
                            ${getStatusBadge(post.status)}
                            ${post.scheduled_time ? `<span>📅 ${formatDate(post.scheduled_time)}</span>` : ''}
                        </div>
                        <div class="post-content-preview">${post.content.substring(0, 150)}${post.content.length > 150 ? '...' : ''}</div>
                        ${post.error_message ? `<div style="color: var(--error-color); font-size: 0.875rem; margin-top: 0.5rem;">Error: ${post.error_message}</div>` : ''}
                    </div>
                    <div class="post-actions">
                        <button class="btn btn-secondary" onclick="editPost(${post.id})">Edit</button>
                        <button class="btn btn-secondary" onclick="duplicatePost(${post.id})">Duplicate</button>
                        <button class="btn btn-danger" onclick="deletePost(${post.id})">Delete</button>
                    </div>
                </div>
            `).join('');
        }
        
        function displayPagination(data) {
            const container = document.getElementById('pagination');
            
            if (data.pages <= 1) {
                container.innerHTML = '';
                return;
            }
            
            let html = '<div style="display: flex; gap: 0.5rem; justify-content: center;">';
            
            if (data.page > 1) {
                html += `<button class="btn btn-secondary" onclick="changePage(${data.page - 1})">Previous</button>`;
            }
            
            html += `<span style="padding: 0.75rem 1rem;">Page ${data.page} of ${data.pages}</span>`;
            
            if (data.page < data.pages) {
                html += `<button class="btn btn-secondary" onclick="changePage(${data.page + 1})">Next</button>`;
            }
            
            html += '</div>';
            container.innerHTML = html;
        }
        
        function changePage(page) {
            currentPage = page;
            loadPosts();
        }
        
        function editPost(id) {
            window.location.href = `/create-post.html?id=${id}`;
        }
        
        async function duplicatePost(id) {
            try {
                await apiCall(`/posts/${id}/duplicate`, { method: 'POST' });
                toast('Post duplicated!', 'success');
                loadPosts();
            } catch (error) {
                toast('Error duplicating post: ' + error.message, 'error');
            }
        }
        
        async function deletePost(id) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            
            try {
                await apiCall(`/posts/${id}`, { method: 'DELETE' });
                toast('Post deleted', 'success');
                loadPosts();
            } catch (error) {
                toast('Error deleting post: ' + error.message, 'error');
            }
        }
        
        // Event listeners
        document.getElementById('filterStatus').addEventListener('change', (e) => {
            filters.status = e.target.value;
            currentPage = 1;
            loadPosts();
        });
        
        document.getElementById('filterPlatform').addEventListener('change', (e) => {
            filters.platform = e.target.value;
            currentPage = 1;
            loadPosts();
        });
        
        // Load on page load
        document.addEventListener('DOMContentLoaded', loadPosts);
    </script>
</body>
</html>
