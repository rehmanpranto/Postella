<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Postella</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
</head>
<body class="dashboard-page">
    <nav class="navbar">
        <div class="nav-brand">📮 Postella</div>
        <button class="nav-toggle" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="nav-menu">
            <a href="/index.html" class="nav-link active">Dashboard</a>
            <a href="/calendar.html" class="nav-link">Calendar</a>
            <a href="/posts.html" class="nav-link">Posts</a>
            <a href="/settings.html" class="nav-link">Settings</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            <a href="#" class="nav-link" id="logoutBtn">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="dashboard-hero">
            <div>
                <h1>Welcome back</h1>
                <p>Track your pipeline and keep every post on schedule.</p>
            </div>
            <div class="dashboard-actions">
                <button class="btn btn-secondary" onclick="location.href='/calendar.html'">View calendar</button>
                <button class="btn btn-primary" onclick="location.href='/create-post.html'">+ Create Post</button>
            </div>
        </div>
        <div class="page-header">
            <h1>Dashboard</h1>
            <button class="btn btn-primary" onclick="location.href='/create-post.html'">
                + Create Post
            </button>
        </div>
        
        <!-- Stats Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-value" id="totalPosts">0</div>
                <div class="stat-label">Total Posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="scheduledPosts">0</div>
                <div class="stat-label">Scheduled</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="postedPosts">0</div>
                <div class="stat-label">Posted</div>
            </div>
            <div class="stat-card">
                <div class="stat-value" id="failedPosts">0</div>
                <div class="stat-label">Failed</div>
            </div>
        </div>
        
        <!-- Recent Posts -->
        <div class="section">
            <h2>Recent Posts</h2>
            <div id="recentPosts" class="posts-list">
                <div class="loading">Loading...</div>
            </div>
        </div>
        
        <!-- Upcoming Schedule -->
        <div class="section">
            <h2>Upcoming This Week</h2>
            <div id="upcomingPosts" class="posts-list">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/dashboard.js"></script>
</body>
</html>
