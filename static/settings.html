<!DOCTYPE html>
<ht            <a href="/settings.html" class="nav-link">Settings</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            <a href="#" class="nav-link" id="logoutBtn">Logout</a> lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings — Postella</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📮 Postella</div>
        <button class="nav-toggle" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="nav-menu">
            <a href="/index.html" class="nav-link">Dashboard</a>
            <a href="/calendar.html" class="nav-link">Calendar</a>
            <a href="/posts.html" class="nav-link">Posts</a>
            <a href="/settings.html" class="nav-link active">Settings</a>
            <a href="#" class="nav-link" id="logoutBtn">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <h1>Settings</h1>
        
        <!-- Connected Platforms -->
        <div class="section">
            <h2>Connected Platforms</h2>
            <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
                Connect your social media accounts to enable automatic posting.
            </p>
            
            <div id="connectedPlatforms">
                <div class="loading">Loading...</div>
            </div>
            
            <h3 style="margin-top: 2rem;">Connect New Platform</h3>
            <div style="display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem;">
                <button class="btn btn-primary" onclick="connectPlatform('facebook')">
                    Connect Facebook
                </button>
                <button class="btn btn-primary" onclick="connectPlatform('instagram')">
                    Connect Instagram
                </button>
                <button class="btn btn-primary" onclick="connectPlatform('linkedin')">
                    Connect LinkedIn
                </button>
                <button class="btn btn-primary" onclick="connectPlatform('twitter')">
                    Connect Twitter/X
                </button>
            </div>
        </div>
        
        <!-- Change Password -->
        <div class="section">
            <h2>Change Password</h2>
            
            <form id="changePasswordForm" style="max-width: 500px;">
                <div class="form-group">
                    <label for="oldPassword">Current Password</label>
                    <input type="password" id="oldPassword" name="old_password" required>
                </div>
                
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" name="new_password" required minlength="8">
                </div>
                
                <div id="passwordError" class="error-message" style="display: none;"></div>
                <div id="passwordSuccess" class="success-message" style="display: none;"></div>
                
                <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
        </div>
        
        <!-- Account Info -->
        <div class="section">
            <h2>Account Information</h2>
            <div id="accountInfo">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script>
        if (!requireAuth()) throw new Error('Auth required');
        
        async function loadSettings() {
            await loadConnectedPlatforms();
            await loadAccountInfo();
        }
        
        async function loadConnectedPlatforms() {
            try {
                const data = await apiCall('/oauth/tokens');
                const container = document.getElementById('connectedPlatforms');
                
                if (data.tokens.length === 0) {
                    container.innerHTML = '<p style="color: var(--text-secondary);">No platforms connected yet.</p>';
                    return;
                }
                
                container.innerHTML = data.tokens.map(token => `
                    <div class="post-item">
                        <div class="post-info">
                            <div class="post-title">${getPlatformBadge(token.platform)}</div>
                            <div class="post-meta">
                                ${token.platform_username ? `<span>@${token.platform_username}</span>` : ''}
                                ${token.is_active ? '<span class="badge badge-posted">Active</span>' : '<span class="badge badge-failed">Inactive</span>'}
                                ${token.expires_at ? `<span>Expires: ${formatDateShort(token.expires_at)}</span>` : ''}
                            </div>
                        </div>
                        <div class="post-actions">
                            <button class="btn btn-danger" onclick="disconnectPlatform(${token.id})">Disconnect</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading platforms:', error);
            }
        }
        
        async function loadAccountInfo() {
            try {
                const user = await apiCall('/auth/me');
                const container = document.getElementById('accountInfo');
                
                container.innerHTML = `
                    <p><strong>Name:</strong> ${user.full_name}</p>
                    <p><strong>Email:</strong> ${user.email}</p>
                    <p><strong>Role:</strong> ${user.role}</p>
                    <p><strong>Member since:</strong> ${formatDateShort(user.created_at)}</p>
                `;
            } catch (error) {
                console.error('Error loading account info:', error);
            }
        }
        
        async function connectPlatform(platform) {
            try {
                const data = await apiCall(`/oauth/${platform}/connect`);
                window.location.href = data.authorization_url;
            } catch (error) {
                toast('Error connecting platform: ' + error.message, 'error');
            }
        }
        
        async function disconnectPlatform(tokenId) {
            if (!confirm('Are you sure you want to disconnect this platform?')) return;
            
            try {
                await apiCall(`/oauth/tokens/${tokenId}`, { method: 'DELETE' });
                toast('Platform disconnected', 'success');
                loadConnectedPlatforms();
            } catch (error) {
                toast('Error disconnecting: ' + error.message, 'error');
            }
        }
        
        // Change password form
        document.getElementById('changePasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            setLoading(btn, true);
            
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;
            
            try {
                await apiCall('/auth/change-password', {
                    method: 'POST',
                    body: JSON.stringify({
                        old_password: oldPassword,
                        new_password: newPassword
                    })
                });
                
                toast('Password updated successfully!', 'success');
                hideError('passwordError');
                hideError('passwordSuccess');
                document.getElementById('changePasswordForm').reset();
            } catch (error) {
                showError('passwordError', error.message);
                hideError('passwordSuccess');
            } finally {
                setLoading(btn, false);
            }
        });
        
        // Check for OAuth callback
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('oauth_success') === 'true') {
            const platform = urlParams.get('platform');
            toast(`Successfully connected to ${platform}!`, 'success');
            window.history.replaceState({}, '', '/settings.html');
        }
        
        // Load on page load
        document.addEventListener('DOMContentLoaded', loadSettings);
    </script>
</body>
</html>
