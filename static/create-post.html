<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post — Postella</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📮</text></svg>">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">📮 Postella</div>
        <button class="nav-toggle" aria-label="Menu">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
        </button>
        <div class="nav-menu">
            <a href="/index.html" class="nav-link">Dashboard</a>
            <a href="/calendar.html" class="nav-link">Calendar</a>
            <a href="/posts.html" class="nav-link">Posts</a>
            <a href="/settings.html" class="nav-link">Settings</a>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">🌙</button>
            <a href="#" class="nav-link" id="logoutBtn">Logout</a>
        </div>
    </nav>
    
    <div class="container">
        <div class="page-header">
            <h1 id="pageTitle">Create Post</h1>
        </div>
        
        <div class="form-container">
            <form id="postForm" enctype="multipart/form-data">
                <input type="hidden" id="postId" name="post_id">
                
                <div class="form-group">
                    <label for="title">Title *</label>
                    <input type="text" id="title" name="title" required>
                </div>
                
                <div class="form-group">
                    <label>Platform(s) *</label>
                    <div id="platformPicker" class="platform-picker">
                        <label class="platform-check platform-check-all">
                            <input type="checkbox" id="platformAll" value="all">
                            <span class="platform-check-label">🌐 All Platforms</span>
                        </label>
                        <div class="platform-check-divider"></div>
                        <label class="platform-check">
                            <input type="checkbox" name="platforms" value="facebook">
                            <span class="platform-check-label">📘 Facebook</span>
                        </label>
                        <label class="platform-check">
                            <input type="checkbox" name="platforms" value="instagram">
                            <span class="platform-check-label">📸 Instagram</span>
                        </label>
                        <label class="platform-check">
                            <input type="checkbox" name="platforms" value="linkedin">
                            <span class="platform-check-label">💼 LinkedIn</span>
                        </label>
                        <label class="platform-check">
                            <input type="checkbox" name="platforms" value="twitter">
                            <span class="platform-check-label">𝕏 Twitter/X</span>
                        </label>
                    </div>
                    <div id="platformInfo" class="platform-info"></div>
                </div>
                
                <div class="form-group">
                    <label for="content">Content *</label>
                    <textarea id="content" name="content" rows="6" required></textarea>
                    <div class="char-count">
                        <span id="charCount">0</span> / <span id="maxChars">unlimited</span>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="media">Media (Image/Video)</label>
                    <input type="file" id="media" name="media" accept="image/*,video/*">
                    <div id="mediaPreview" class="media-preview"></div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="scheduledDate">Scheduled Date</label>
                        <input type="date" id="scheduledDate" name="scheduled_date">
                    </div>
                    
                    <div class="form-group">
                        <label for="scheduledTime">Scheduled Time</label>
                        <input type="time" id="scheduledTime" name="scheduled_time">
                    </div>
                    
                    <div class="form-group">
                        <label for="country">Country</label>
                        <select id="country" name="country"></select>
                    </div>

                    <div class="form-group">
                        <label for="timezone">Timezone</label>
                        <select id="timezone" name="timezone"></select>
                    </div>
                </div>
                
                <div id="errorMessage" class="error-message" style="display: none;"></div>
                <div id="successMessage" class="success-message" style="display: none;"></div>
                
                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="location.href='/posts.html'">
                        Cancel
                    </button>
                    <button type="submit" class="btn btn-primary" id="submitBtn">
                        Create Post
                    </button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="/static/js/app.js"></script>
    <script src="/static/js/post-form.js"></script>
</body>
</html>
